<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Festival de la Familia — Admin</title>
<style>
  :root {
    --navy:   #0d2b5e;
    --blue:   #1e6fbe;
    --green:  #3aaa35;
    --white:  #ffffff;
    --bg:     #071628;
    --surface:#0d2b5e;
    --surface2:#142f5e;
    --border: #1e3f7a;
    --muted:  #7ba3d0;
    --text:   #e8f0fb;
    --danger: #e05252;
    --warn:   #f0c040;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px; width: 340px; text-align: center;
  }
  .login-logo { font-size: 1.5rem; font-weight: 700; color: var(--white); margin-bottom: 4px; }
  .login-logo span { color: var(--green); }
  .login-sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 1rem; margin-bottom: 14px;
  }

  .btn { padding: 10px 20px; border: none; border-radius: var(--radius); cursor: pointer; font-size: .875rem; font-weight: 600; transition: opacity .2s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--blue);  color: var(--white); width: 100%; padding: 13px; }
  .btn-success { background: var(--green); color: var(--white); }
  .btn-danger  { background: var(--danger); color: var(--white); }
  .btn-warn    { background: var(--warn);   color: #111; }
  .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  /* APP */
  #app { display: none; }
  header {
    background: var(--navy); border-bottom: 2px solid var(--green);
    padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 58px;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-brand .dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; }
  header h1 { font-size: 1rem; font-weight: 700; color: var(--white); }
  header span { color: var(--muted); font-size: .82rem; }

  .stats { display: flex; gap: 14px; padding: 20px 28px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 22px; min-width: 130px; text-align: center;
  }
  .stat-card .num { font-size: 1.9rem; font-weight: 700; }
  .stat-card .lbl { color: var(--muted); font-size: .78rem; margin-top: 3px; }
  .stat-card.blue  .num { color: var(--blue); }
  .stat-card.green .num { color: var(--green); }
  .stat-card.warn  .num { color: var(--warn); }

  .toolbar {
    padding: 14px 28px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .toolbar input, .toolbar select {
    padding: 9px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: .875rem;
  }
  .toolbar input { width: 200px; }

  .table-wrap { padding: 0 28px 28px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th {
    background: var(--surface); color: var(--muted); padding: 10px 12px;
    text-align: left; font-weight: 600; white-space: nowrap;
    border-bottom: 2px solid var(--blue);
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--surface2); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
  .badge-pending  { background: #2a2000; color: var(--warn); }
  .badge-arrived  { background: #0a2e0a; color: var(--green); }
  .badge-departed { background: #101828; color: var(--muted); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--green);
    border-radius: 16px; padding: 28px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin-bottom: 20px; font-size: 1.05rem; color: var(--white); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1/-1; }
  .field label { display: block; color: var(--muted); font-size: .78rem; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: .875rem;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .divider { grid-column: 1/-1; border: none; border-top: 1px solid var(--border); margin: 2px 0; }
  .section-label {
    grid-column: 1/-1; color: var(--blue); font-size: .76rem;
    text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  }
  .empty { text-align: center; color: var(--muted); padding: 48px; }
  #error-msg { color: var(--danger); font-size: .85rem; margin-top: 8px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Festival <span>de la Familia</span></div>
    <div class="login-sub">Panel de Administración · Staff</div>
    <input type="password" id="pwd-input" placeholder="Contraseña de acceso" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn btn-primary" onclick="doLogin()">Ingresar</button>
    <div id="error-msg"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-brand">
      <div class="dot"></div>
      <h1>Festival de la Familia &mdash; Control de Staff</h1>
    </div>
    <span>Acarigua &nbsp;·&nbsp; 23–29 Mar 2025</span>
  </header>

  <div class="stats" id="stats-row"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 Buscar nombre, rol, área..." oninput="renderTable()"/>
    <select id="filter-hotel" onchange="renderTable()">
      <option value="">Todos los hoteles</option>
      <option>Hotel A</option>
      <option>Hotel B</option>
    </select>
    <select id="filter-status" onchange="renderTable()">
      <option value="">Todos los estados</option>
      <option value="pending">Pendiente</option>
      <option value="arrived">Llegó</option>
      <option value="departed">Se fue</option>
    </select>
    <select id="filter-date" onchange="renderTable()">
      <option value="">Todas las llegadas</option>
    </select>
    <button class="btn btn-success" onclick="openModal()">+ Agregar persona</button>
    <button class="btn btn-ghost" onclick="loadStaff()">↻ Actualizar</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nombre</th><th>Teléfono</th><th>Rol / Área</th>
          <th>Hotel</th><th>Llegada</th><th>Salida</th>
          <th>Estado</th><th>Check-in</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="staff-tbody"></tbody>
    </table>
    <div id="empty-msg" class="empty" style="display:none">No hay personas que coincidan con el filtro.</div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Agregar persona</h2>
    <div class="form-grid">
      <div class="field full"><label>Nombre completo *</label><input id="f-name" placeholder="Ej: María González"/></div>
      <div class="field"><label>Teléfono</label><input id="f-phone" placeholder="+58 412 0000000"/></div>
      <div class="field"><label>Rol</label><input id="f-role" placeholder="Ej: Coordinador"/></div>
      <div class="field full"><label>Área</label><input id="f-area" placeholder="Ej: Logística, Sonido, Prensa..."/></div>
      <div class="field full"><label>Hotel</label>
        <select id="f-hotel"><option value="">Sin asignar</option><option>Hotel A</option><option>Hotel B</option></select>
      </div>
      <hr class="divider"/>
      <span class="section-label">✈ Vuelo de llegada</span>
      <div class="field"><label>Fecha</label><input id="f-fin-date" type="date"/></div>
      <div class="field"><label>Hora</label><input id="f-fin-time" type="time"/></div>
      <div class="field full"><label>Origen</label><input id="f-fin-origin" placeholder="Ej: Caracas (CCS)"/></div>
      <hr class="divider"/>
      <span class="section-label">✈ Vuelo de salida</span>
      <div class="field"><label>Fecha</label><input id="f-fout-date" type="date"/></div>
      <div class="field"><label>Hora</label><input id="f-fout-time" type="time"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePerson()">Guardar</button>
    </div>
  </div>
</div>

<script>
const API = "https://festival-staff-api.metaso.workers.dev";
let TOKEN = "", allStaff = [], editingId = null;

async function doLogin() {
  const pwd = document.getElementById("pwd-input").value.trim();
  if (!pwd) return;
  TOKEN = pwd;
  try {
    const res = await fetch(`${API}/admin/staff`, { headers: { Authorization: `Bearer ${TOKEN}` } });
    if (!res.ok) throw new Error();
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    allStaff = await res.json();
    renderAll();
  } catch {
    document.getElementById("error-msg").textContent = "Contraseña incorrecta.";
    TOKEN = "";
  }
}

async function loadStaff() {
  const res = await fetch(`${API}/admin/staff`, { headers: { Authorization: `Bearer ${TOKEN}` } });
  allStaff = await res.json();
  renderAll();
}

function renderAll() { renderStats(); renderDateFilter(); renderTable(); }

function renderStats() {
  const t = allStaff.length, a = allStaff.filter(p=>p.status==="arrived").length,
        p = allStaff.filter(p=>p.status==="pending").length,
        hA = allStaff.filter(p=>p.hotel==="Hotel A").length,
        hB = allStaff.filter(p=>p.hotel==="Hotel B").length;
  document.getElementById("stats-row").innerHTML = `
    <div class="stat-card blue"><div class="num">${t}</div><div class="lbl">Total Staff</div></div>
    <div class="stat-card green"><div class="num">${a}</div><div class="lbl">Llegaron</div></div>
    <div class="stat-card warn"><div class="num">${p}</div><div class="lbl">Pendientes</div></div>
    <div class="stat-card"><div class="num">${hA}</div><div class="lbl">Hotel A</div></div>
    <div class="stat-card"><div class="num">${hB}</div><div class="lbl">Hotel B</div></div>`;
}

function renderDateFilter() {
  const sel = document.getElementById("filter-date"), cur = sel.value;
  const dates = [...new Set(allStaff.map(p=>p.flight_in_date).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todas las llegadas</option>' +
    dates.map(d=>`<option value="${d}"${d===cur?' selected':''}>${formatDate(d)}</option>`).join('');
}

function renderTable() {
  const q=document.getElementById("search").value.toLowerCase(),
        hotel=document.getElementById("filter-hotel").value,
        status=document.getElementById("filter-status").value,
        date=document.getElementById("filter-date").value;
  let f = allStaff.filter(p =>
    (!q || (p.name||"").toLowerCase().includes(q)||(p.role||"").toLowerCase().includes(q)||(p.area||"").toLowerCase().includes(q)) &&
    (!hotel  || p.hotel===hotel) &&
    (!status || p.status===status) &&
    (!date   || p.flight_in_date===date)
  ).sort((a,b)=>(a.flight_in_date||"").localeCompare(b.flight_in_date||"")||(a.name||"").localeCompare(b.name||""));
  document.getElementById("empty-msg").style.display = f.length ? "none" : "block";
  document.getElementById("staff-tbody").innerHTML = f.map((p,i)=>`
    <tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td><strong>${p.name}</strong></td>
      <td>${p.phone||"—"}</td>
      <td>${[p.role,p.area].filter(Boolean).join(" · ")||"—"}</td>
      <td>${p.hotel||"—"}</td>
      <td>${p.flight_in_date?`${formatDate(p.flight_in_date)} ${p.flight_in_time||""}<br><small style="color:var(--muted)">${p.flight_in_origin||""}</small>`:"—"}</td>
      <td>${p.flight_out_date?`${formatDate(p.flight_out_date)} ${p.flight_out_time||""}`:"—"}</td>
      <td><span class="badge badge-${p.status}">${statusLabel(p.status)}</span></td>
      <td style="color:var(--muted);font-size:.78rem">${p.checkin_time?new Date(p.checkin_time).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'}):"—"}</td>
      <td style="white-space:nowrap;display:flex;gap:6px">
        <button class="btn btn-ghost" style="padding:5px 9px;font-size:.75rem" onclick="editPerson('${p.id}')">✏️</button>
        <button class="btn btn-success" style="padding:5px 9px;font-size:.75rem" onclick="markStatus('${p.id}','arrived')">✅</button>
        <button class="btn btn-danger" style="padding:5px 9px;font-size:.75rem" onclick="deletePerson('${p.id}','${p.name}')">🗑</button>
      </td>
    </tr>`).join('');
}

function statusLabel(s){return{pending:"Pendiente",arrived:"Llegó",departed:"Se fue"}[s]||s;}
function formatDate(d){if(!d)return"";const[y,m,day]=d.split("-");return`${parseInt(day)} ${["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)]}`;}

function openModal(id=null){
  editingId=id;
  document.getElementById("modal-title").textContent=id?"Editar persona":"Agregar persona";
  const p=id?allStaff.find(x=>x.id===id):{};
  ["name","phone","role","area"].forEach(k=>document.getElementById(`f-${k}`).value=p[k]||"");
  document.getElementById("f-hotel").value=p.hotel||"";
  document.getElementById("f-fin-date").value=p.flight_in_date||"";
  document.getElementById("f-fin-time").value=p.flight_in_time||"";
  document.getElementById("f-fin-origin").value=p.flight_in_origin||"";
  document.getElementById("f-fout-date").value=p.flight_out_date||"";
  document.getElementById("f-fout-time").value=p.flight_out_time||"";
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");editingId=null;}

async function savePerson(){
  const name=document.getElementById("f-name").value.trim();
  if(!name){alert("El nombre es obligatorio.");return;}
  const body={name,phone:document.getElementById("f-phone").value.trim(),role:document.getElementById("f-role").value.trim(),
    area:document.getElementById("f-area").value.trim(),hotel:document.getElementById("f-hotel").value,
    flight_in_date:document.getElementById("f-fin-date").value,flight_in_time:document.getElementById("f-fin-time").value,
    flight_in_origin:document.getElementById("f-fin-origin").value.trim(),
    flight_out_date:document.getElementById("f-fout-date").value,flight_out_time:document.getElementById("f-fout-time").value};
  await fetch(editingId?`${API}/admin/staff/${editingId}`:`${API}/admin/staff`,
    {method:editingId?"PUT":"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${TOKEN}`},body:JSON.stringify(body)});
  closeModal();loadStaff();
}
function editPerson(id){openModal(id);}
async function deletePerson(id,name){
  if(!confirm(`¿Eliminar a ${name}?`))return;
  await fetch(`${API}/admin/staff/${id}`,{method:"DELETE",headers:{Authorization:`Bearer ${TOKEN}`}});
  loadStaff();
}
async function markStatus(id,status){
  await fetch(`${API}/admin/staff/${id}`,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:`Bearer ${TOKEN}`},body:JSON.stringify({status})});
  loadStaff();
}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
</script>
</body>
</html>
